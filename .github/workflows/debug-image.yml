name: Build and publish debug image

# Mirrors images/debug/build.sh: multi-arch (amd64+arm64) matters here
# specifically, since the image is attached to pods via `kubectl debug`
# on whatever architecture the target cluster's nodes actually use — a
# single-arch image built on one architecture fails with "exec format
# error" on a node of a different one.

"on":
  push:
    branches: [master]
    paths:
      - "images/debug/**"
      - ".github/workflows/debug-image.yml"
  pull_request:
    paths:
      - "images/debug/**"
      - ".github/workflows/debug-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish alongside :latest and the commit SHA"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/hriships/debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests only validate that the image still builds — no
      # credentials are available to (and no need to) push from a PR.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          tags="${IMAGE}:latest,${IMAGE}:${GITHUB_SHA::7}"
          extra_tag="${{ github.event.inputs.tag }}"
          if [[ -n "$extra_tag" ]]; then
            tags="${tags},${IMAGE}:${extra_tag}"
          fi
          echo "tags=${tags}" >>"$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/debug
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
