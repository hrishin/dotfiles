# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g allow-passthrough on
set -g set-clipboard on

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes using 1,2,3,4 (with prefix key)
bind -r 1 resize-pane -L 5   # Move border left
bind -r 2 resize-pane -R 5   # Move border right
bind -r 3 resize-pane -U 2   # Move border up
bind -r 4 resize-pane -D 2   # Move border down

# New session / kill session, paired with Ghostty's Cmd+N / Cmd+Shift+W
# (see configs/ghostty/config).
bind N new-session
bind X confirm-before -p "kill-session #S? (y/n)" kill-session

#set -g utf8 on
#set -g mouse on

# Optional private additions (machine- or identity-specific bindings,
# options). dotfiles-private should ship a fragment file here rather than
# its own full .tmux.conf — a second full .tmux.conf symlinked over this
# one would just clobber it instead of merging with it. -q suppresses the
# "no such file" error when the fragment doesn't exist.
source-file -q ~/.tmux.private.conf
